name: Update IV surface snapshot

on:
  schedule:
    # ~06:17 UTC daily — an off-the-hour time so it doesn't pile onto the
    # top-of-hour rush other scheduled Actions tend to use.
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Fetch + regrid the Deribit BTC options chain
        run: node scripts/update-iv-surface.mjs --verbose

      - name: Commit snapshot if changed
        run: |
          if ! git diff --quiet -- src/data/iv-surface.json; then
            git config user.name "iv-surface-bot"
            git config user.email "actions@users.noreply.github.com"
            git add src/data/iv-surface.json
            git commit -m "chore: refresh IV surface snapshot ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "No change in snapshot; skipping commit."
          fi
